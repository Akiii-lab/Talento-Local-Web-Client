name: CI - Merge Dev to Main

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    name: Build and Test (Dev)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        continue-on-error: false

      - name: Build project
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            build/
          retention-days: 7

  merge-to-main:
    name: Merge Dev → Main
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Akiii-lab Bot"
          git config user.email "garciasierrandres@gmail.com"

      - name: Fetch all branches
        run: |
          git fetch origin
          git fetch origin main:main

      - name: Merge dev into main
        run: |
          echo "Checking current branch..."
          git branch -a
          
          echo "Checking out main..."
          git checkout main
          
          echo "Commits in main before merge:"
          git log --oneline -5
          
          echo "Commits in dev:"
          git log origin/dev --oneline -5
          
          echo "Merging dev into main..."
          git merge origin/dev --no-ff -m "Auto-merge: dev → main [skip ci]"
          
          echo "Commits in main after merge:"
          git log --oneline -5

      - name: Push to main
        run: |
          echo "Pushing to main..."
          git push origin main
          echo "Merge completed successfully!"

  build-main:
    name: Build Main (Production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            build/
          retention-days: 30